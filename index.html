<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f6f3,#0d0d0d);--surface:light-dark(#fff,#171717);--text:light-dark(#111,#fff);--muted:light-dark(#6b6b6b,#aaa);--line:light-dark(#e6e6e0,#2c2c2c);--yellow:#ffd400;--yellow2:#ffb800;--green:#10a85a;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} #app{min-height:100vh;background:var(--bg)}

main{max-width:1180px;margin:auto;padding:30px 22px 60px} .intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px} h1{font-size:34px;line-height:1.05;margin:0 0 8px;letter-spacing:-1.5px} .intro p{margin:0;color:var(--muted)} .tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end} select,.chip{height:38px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:0 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px} .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .18s,border-color .18s} .card:hover{transform:translateY(-3px);border-color:#c7b500} .pic{height:205px;background:#fff;display:grid;place-items:center;padding:14px;border-bottom:1px solid var(--line)} .pic img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px} .body{padding:15px;display:flex;flex-direction:column;flex:1} .cat{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:#8b7200;margin-bottom:7px} .title{font-weight:800;font-size:16px;line-height:1.25;letter-spacing:-.3px} .desc{font-size:12px;line-height:1.45;color:var(--muted);margin:8px 0 14px} .bottom{margin-top:auto} .price{font-size:24px;font-weight:950;letter-spacing:-.7px;margin-bottom:11px} .btn{display:block;text-align:center;text-decoration:none;background:var(--yellow);color:#111;font-weight:950;border-radius:11px;padding:11px 12px;font-size:13px} .btn:hover{background:#ffe347} .count{margin:18px 0 0;color:var(--muted);font-size:13px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);display:none;grid-column:1/-1} footer{border-top:1px solid var(--line);padding:25px 22px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}} @media(max-width:760px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}.intro{align-items:flex-start;flex-direction:column}.tools{justify-content:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pic{height:180px}h1{font-size:29px}} @media(max-width:480px){main{padding:22px 13px 45px}.head{padding:14px}.grid{grid-template-columns:1fr}.pic{height:220px}}
